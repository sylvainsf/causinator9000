name: 'Causinator 9000 CI Diagnosis'
description: 'Analyze CI failures with Bayesian causal inference. Posts a diagnosis as a job summary, PR comment, or issue.'
author: 'sylvainsf'

branding:
  icon: 'search'
  color: 'orange'

inputs:
  repo:
    description: 'Repository to analyze (default: current repo)'
    required: false
    default: ${{ github.repository }}
  hours:
    description: 'Lookback window in hours (default: 168 for weekly)'
    required: false
    default: '168'
  min-confidence:
    description: 'Minimum confidence threshold for reporting (0-100, default: 50)'
    required: false
    default: '50'
  post-comment:
    description: 'Post diagnosis as a PR comment (true/false, default: false)'
    required: false
    default: 'false'
  create-issue:
    description: 'Open a fresh dated digest issue each run; older ones auto-close after the retention window (true/false, default: false)'
    required: false
    default: 'false'
  issue-label:
    description: 'Label for digest issues (default: c9k-digest)'
    required: false
    default: 'c9k-digest'
  digest-retention-days:
    description: 'Auto-close untouched digest issues older than this many days (default: 14, i.e. the previous two weeks)'
    required: false
    default: '14'
  github-token:
    description: 'GitHub token for API access and posting comments'
    required: false
    default: ${{ github.token }}
  version:
    description: 'C9K engine version to download (default: latest)'
    required: false
    default: 'latest'
  include-user-prs:
    description: |
      Include CI failures from contributor pull-request branches in the
      report. Default false: only main, scheduled, release, and Dependabot
      PR failures are analyzed. Contributor PR branches are full of
      intentional `wip` failures and would dominate any repo-wide report.
      Set to "true" to include them (e.g. for per-PR diagnostics).
    required: false
    default: 'false'

  # ── Auto-issue mode (opt-in, additive) ───────────────────────────────
  # When enabled, c9k files (and dedup-updates) one GitHub issue per
  # detected root cause, instead of (or in addition to) the per-run
  # digest. Designed to be safe-by-default: never runs on PR triggers,
  # never assigns Copilot to flaky-test groups, and offers a dry-run mode.
  auto-issue:
    description: 'Enable per-root-cause auto-issue mode (true/false, default: false)'
    required: false
    default: 'false'
  auto-issue-min-confidence:
    description: 'Confidence floor (0-100) for opening an auto-issue (default: 90)'
    required: false
    default: '90'
  auto-issue-min-members:
    description: 'Minimum failing jobs in a group to open an auto-issue (default: 2)'
    required: false
    default: '2'
  auto-issue-classes:
    description: |
      Comma-separated root-cause classes to file as issues. Defaults to
      "CodeChange,BrokenTestRun,DepMajorBump,DepGroupUpdate". Add "FlakyTestRun" if you
      also want flaky issues filed (they are still never assigned to
      Copilot; combine with `auto-close-flaky` for the recommended workflow).
    required: false
    default: 'CodeChange,BrokenTestRun,DepMajorBump,DepGroupUpdate'
  auto-issue-label:
    description: 'Label applied to all c9k auto-issues (default: c9k-auto)'
    required: false
    default: 'c9k-auto'
  assign-copilot:
    description: 'Assign Copilot to commit/broken root-cause issues (true/false, default: false)'
    required: false
    default: 'false'
  auto-close-flaky:
    description: 'Comment-and-close flaky-test groups (Copilot is never assigned to these). Default: true'
    required: false
    default: 'true'
  auto-close-resolved:
    description: 'Auto-close c9k issues when their root cause is no longer detected (default: false)'
    required: false
    default: 'false'
  close-cross-tool-duplicates:
    description: |
      Close OPEN issues filed by other automation when they reference the
      same failing runs as a c9k root cause. Off by default because other
      tools may own those issues.
    required: false
    default: 'false'
  auto-issue-no-branch-policy:
    description: |
      Disable the branch policy gate. By default, c9k auto-issues are
      ONLY created for failures whose branch is one of:
        - the repository's default branch (where scheduled runs land),
        - a release branch (`release/*`, `release-*`, `v<digit>...`),
        - a Dependabot PR branch (`dependabot/*`).
      Contributor PR branches and ad-hoc feature branches never produce
      issues. Set this to 'true' only for debugging, issuing repo-wide
      tickets from contributor branches is almost always wrong.
    required: false
    default: 'false'
  auto-issue-dry-run:
    description: |
      Print the auto-issue plan to the job summary without making any
      changes. Use this on first deployment to assess issue volume before
      enabling for real.
    required: false
    default: 'false'

outputs:
  report:
    description: 'The generated markdown report'
    value: ${{ steps.run.outputs.report }}
  alert-count:
    description: 'Number of alert groups found'
    value: ${{ steps.run.outputs.alert-count }}

runs:
  using: 'composite'
  steps:
    - name: Download c9k-engine
      shell: bash
      run: |
        set -e
        VERSION="${{ inputs.version }}"
        REPO="sylvainsf/causinator9000"
        ASSET="c9k-engine-linux-amd64.tar.gz"
        mkdir -p /tmp/c9k

        if [ "$VERSION" = "latest" ]; then
          URL="https://github.com/$REPO/releases/latest/download/$ASSET"
        else
          URL="https://github.com/$REPO/releases/download/$VERSION/$ASSET"
        fi

        echo "Downloading c9k-engine from $URL"
        curl -fsSL "$URL" -o "/tmp/c9k/$ASSET" || {
          echo "::error::Could not download c9k-engine from $URL"
          exit 1
        }
        tar xzf "/tmp/c9k/$ASSET" -C /tmp/c9k
        chmod +x /tmp/c9k/c9k-engine

        # Fetch the auto-issue helper script. Pinned to the same version as
        # the engine binary so behaviour stays consistent. Falls back to main
        # only if the release tag doesn't carry the script (older releases
        # before this feature shipped).
        SCRIPT_URL_VERSIONED="https://raw.githubusercontent.com/$REPO/$VERSION/scripts/auto_issue.py"
        SCRIPT_URL_FALLBACK="https://raw.githubusercontent.com/$REPO/main/scripts/auto_issue.py"
        if [ "$VERSION" = "latest" ]; then
          curl -fsSL "$SCRIPT_URL_FALLBACK" -o /tmp/c9k/auto_issue.py || true
        else
          curl -fsSL "$SCRIPT_URL_VERSIONED" -o /tmp/c9k/auto_issue.py \
            || curl -fsSL "$SCRIPT_URL_FALLBACK" -o /tmp/c9k/auto_issue.py \
            || true
        fi
        chmod +x /tmp/c9k/auto_issue.py 2>/dev/null || true

    - name: Run c9k report
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e
        EXTRA_FLAGS=()
        if [ "${{ inputs.include-user-prs }}" = "true" ]; then
          EXTRA_FLAGS+=(--include-user-prs)
        fi

        /tmp/c9k/c9k-engine report \
          --repo "${{ inputs.repo }}" \
          --hours "${{ inputs.hours }}" \
          --min-confidence "${{ inputs.min-confidence }}" \
          --embedded-heuristics \
          "${EXTRA_FLAGS[@]}" \
          > /tmp/c9k-report.md 2>/tmp/c9k-stderr.log

        # Always emit JSON too (cheap; same engine, second invocation reuses
        # gh's HTTP cache). The auto-issue step consumes this. We tolerate
        # failures here so the markdown report path is never blocked by a
        # JSON-mode regression.
        /tmp/c9k/c9k-engine report \
          --repo "${{ inputs.repo }}" \
          --hours "${{ inputs.hours }}" \
          --min-confidence "${{ inputs.min-confidence }}" \
          --embedded-heuristics \
          --format json \
          "${EXTRA_FLAGS[@]}" \
          > /tmp/c9k-report.json 2>>/tmp/c9k-stderr.log || echo '{"alert_groups":[]}' > /tmp/c9k-report.json

        # Output to job summary
        cat /tmp/c9k-report.md >> "$GITHUB_STEP_SUMMARY"

        # Set outputs
        ALERT_COUNT=$(grep -c "^|" /tmp/c9k-report.md | head -1 || echo "0")
        echo "alert-count=$ALERT_COUNT" >> "$GITHUB_OUTPUT"
        {
          echo "report<<C9K_EOF"
          cat /tmp/c9k-report.md
          echo "C9K_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ inputs.repo }}" \
          --body-file /tmp/c9k-report.md 2>/dev/null || true

    - name: Auto-issue per root cause
      # Auto-issue mode is intentionally NEVER triggered by pull_request events.
      # Filing or mutating issues from PR-triggered runs would let any
      # contributor's PR change repo-wide issue state. Restrict to schedule,
      # workflow_dispatch, push to default branch, or workflow_run triggers.
      #
      # IMPORTANT: The calling workflow MUST set a concurrency group to prevent
      # duplicate issue creation from parallel runs:
      #   concurrency:
      #     group: c9k-auto-issue-${{ github.repository }}
      #     cancel-in-progress: false
      if: >-
        inputs.auto-issue == 'true' &&
        github.event_name != 'pull_request' &&
        github.event_name != 'pull_request_target'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e
        if [ ! -f /tmp/c9k/auto_issue.py ]; then
          echo "::warning::auto-issue script not found at /tmp/c9k/auto_issue.py, skipping."
          exit 0
        fi
        if [ ! -s /tmp/c9k-report.json ]; then
          echo "::warning::JSON report missing or empty, skipping auto-issue step."
          exit 0
        fi

        FLAGS=()
        if [ "${{ inputs.assign-copilot }}" = "true" ];                  then FLAGS+=(--assign-copilot); fi
        if [ "${{ inputs.auto-close-flaky }}" = "true" ];                then FLAGS+=(--auto-close-flaky); fi
        if [ "${{ inputs.auto-close-resolved }}" = "true" ];             then FLAGS+=(--auto-close-resolved); fi
        if [ "${{ inputs.close-cross-tool-duplicates }}" = "true" ];     then FLAGS+=(--close-cross-tool-duplicates); fi
        if [ "${{ inputs.auto-issue-no-branch-policy }}" = "true" ];     then FLAGS+=(--no-branch-policy); fi
        if [ "${{ inputs.auto-issue-dry-run }}" = "true" ];              then FLAGS+=(--dry-run); fi

        python3 /tmp/c9k/auto_issue.py \
          --report /tmp/c9k-report.json \
          --repo "${{ inputs.repo }}" \
          --label "${{ inputs.auto-issue-label }}" \
          --min-confidence "${{ inputs.auto-issue-min-confidence }}" \
          --min-members "${{ inputs.auto-issue-min-members }}" \
          --classes "${{ inputs.auto-issue-classes }}" \
          --last-run-label "Updated by ${{ github.workflow }} run #${{ github.run_number }} at $(date -u +%Y-%m-%dT%H:%MZ)" \
          --output-summary /tmp/c9k-auto-issue-summary.md \
          "${FLAGS[@]}" \
          | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Create digest issue and prune old ones
      # Digest-issue mode is intentionally NEVER triggered by pull_request events.
      # Filing or commenting on issues from PR-triggered runs would let any
      # contributor's PR mutate repo-wide issue state. Restrict to schedule,
      # workflow_dispatch, push to default branch, or workflow_run triggers.
      if: >-
        inputs.create-issue == 'true' &&
        github.event_name != 'pull_request' &&
        github.event_name != 'pull_request_target'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        REPO="${{ inputs.repo }}"
        LABEL="${{ inputs.issue-label }}"
        RETENTION_DAYS="${{ inputs.digest-retention-days }}"

        gh label create "$LABEL" --repo "$REPO" \
          --description "Causinator 9000 CI failure digest" \
          --color "D93F0B" 2>/dev/null || true

        # Compose the digest body: the report, optionally followed by the
        # auto-issue outcomes summary so the digest reflects what the
        # auto-issue mode did during this run.
        DIGEST_BODY=/tmp/c9k-digest-body.md
        cp /tmp/c9k-report.md "$DIGEST_BODY"
        if [ -s /tmp/c9k-auto-issue-summary.md ]; then
          {
            echo
            echo "---"
            echo
            cat /tmp/c9k-auto-issue-summary.md
          } >> "$DIGEST_BODY"
        fi

        # Always open a FRESH dated issue for this run. Each nightly/weekly
        # report is its own issue; we never append to a previous one.
        gh issue create --repo "$REPO" \
          --title "Causinator 9000 CI Failure Digest: $(date -u +%Y-%m-%d)" \
          --body-file "$DIGEST_BODY" \
          --label "$LABEL" 2>/dev/null || true

        # Prune: auto-close digest issues older than the retention window so
        # nobody has to clean them up by hand. Issues a human has engaged
        # with (comments or assignees) are left untouched. jq's `length` on a
        # number returns that number, so the comment check works whether gh
        # reports `comments` as a count or as an array.
        STALE=$(RETENTION_DAYS="$RETENTION_DAYS" gh issue list --repo "$REPO" \
          --label "$LABEL" --state open \
          --json number,createdAt,comments,assignees --limit 200 \
          --jq '(env.RETENTION_DAYS|tonumber) as $d | .[] | select((.comments|length)==0 and (.assignees|length)==0 and ((.createdAt|fromdateiso8601) < (now - ($d*86400)))) | .number' 2>/dev/null || echo "")

        for n in $STALE; do
          gh issue close "$n" --repo "$REPO" \
            --comment "Auto-closed by Causinator 9000: this digest is more than ${RETENTION_DAYS} days old and has been superseded by newer reports. Reopen it if you still need it." 2>/dev/null || true
        done
