name: 'Causinator 9000 CI Diagnosis'
description: 'Analyze CI failures with Bayesian causal inference. Posts a diagnosis as a job summary, PR comment, or issue.'
author: 'sylvainsf'

branding:
  icon: 'search'
  color: 'orange'

inputs:
  repo:
    description: 'Repository to analyze (default: current repo)'
    required: false
    default: ${{ github.repository }}
  hours:
    description: 'Lookback window in hours (default: 168 for weekly)'
    required: false
    default: '168'
  min-confidence:
    description: 'Minimum confidence threshold for reporting (0-100, default: 50)'
    required: false
    default: '50'
  post-comment:
    description: 'Post diagnosis as a PR comment (true/false, default: false)'
    required: false
    default: 'false'
  create-issue:
    description: 'Create or update a digest issue (true/false, default: false)'
    required: false
    default: 'false'
  issue-label:
    description: 'Label for digest issues (default: c9k-digest)'
    required: false
    default: 'c9k-digest'
  github-token:
    description: 'GitHub token for API access and posting comments'
    required: false
    default: ${{ github.token }}
  version:
    description: 'C9K engine version to download (default: latest)'
    required: false
    default: 'latest'

outputs:
  report:
    description: 'The generated markdown report'
    value: ${{ steps.run.outputs.report }}
  alert-count:
    description: 'Number of alert groups found'
    value: ${{ steps.run.outputs.alert-count }}

runs:
  using: 'composite'
  steps:
    - name: Download c9k-engine
      shell: bash
      run: |
        set -e
        VERSION="${{ inputs.version }}"
        REPO="sylvainsf/causinator9000"
        ASSET="c9k-engine-linux-amd64.tar.gz"
        mkdir -p /tmp/c9k

        if [ "$VERSION" = "latest" ]; then
          URL="https://github.com/$REPO/releases/latest/download/$ASSET"
        else
          URL="https://github.com/$REPO/releases/download/$VERSION/$ASSET"
        fi

        echo "Downloading c9k-engine from $URL"
        curl -fsSL "$URL" -o "/tmp/c9k/$ASSET" || {
          echo "::error::Could not download c9k-engine from $URL"
          exit 1
        }
        tar xzf "/tmp/c9k/$ASSET" -C /tmp/c9k
        chmod +x /tmp/c9k/c9k-engine

    - name: Run c9k report
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e
        /tmp/c9k/c9k-engine report \
          --repo "${{ inputs.repo }}" \
          --hours "${{ inputs.hours }}" \
          --min-confidence "${{ inputs.min-confidence }}" \
          --embedded-heuristics \
          > /tmp/c9k-report.md 2>/tmp/c9k-stderr.log

        # Output to job summary
        cat /tmp/c9k-report.md >> "$GITHUB_STEP_SUMMARY"

        # Set outputs
        ALERT_COUNT=$(grep -c "^|" /tmp/c9k-report.md | head -1 || echo "0")
        echo "alert-count=$ALERT_COUNT" >> "$GITHUB_OUTPUT"
        {
          echo "report<<C9K_EOF"
          cat /tmp/c9k-report.md
          echo "C9K_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ inputs.repo }}" \
          --body-file /tmp/c9k-report.md 2>/dev/null || true

    - name: Create or update digest issue
      if: inputs.create-issue == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        REPO="${{ inputs.repo }}"
        LABEL="${{ inputs.issue-label }}"

        gh label create "$LABEL" --repo "$REPO" \
          --description "Causinator 9000 CI failure digest" \
          --color "D93F0B" 2>/dev/null || true

        EXISTING=$(gh issue list --repo "$REPO" \
          --label "$LABEL" --state open \
          --json number --limit 1 --jq '.[0].number' 2>/dev/null || echo "")

        if [ -n "$EXISTING" ]; then
          gh issue comment "$EXISTING" --repo "$REPO" \
            --body-file /tmp/c9k-report.md 2>/dev/null || true
        else
          gh issue create --repo "$REPO" \
            --title "Causinator 9000 CI Failure Digest — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/c9k-report.md \
            --label "$LABEL" 2>/dev/null || true
        fi
